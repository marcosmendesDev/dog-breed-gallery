<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeria de Raças de Cães</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header class="app-header">
      <h1>Galeria de Raças de Cães</h1>
    </header>

    <div class="app-container">
      <!-- PAINEL LATERAL (SIDEBAR) -->
      <aside class="sidebar">
        <h2>Raças Disponíveis</h2>

        <!-- Formulário de Busca/Filtro -->
        <form id="form-busca">
          <input type="text" id="pesquisa" placeholder="Buscar raça ou sub-raça..." />
          <button type="submit" id="botao">Buscar</button>
        </form>

        <!-- Contador de Raças -->
        <p id="total-racas" class="texto-contador"></p>

        <!-- Mensagens de Feedback/Erro da Busca -->
        <p id="mensagem"></p>

        <!-- Container onde o JavaScript vai injetar os CARDS de Raças/Sub-raças -->
        <div id="list-breeds"></div>
      </aside>

      <!-- ÁREA PRINCIPAL (VISUALIZADOR) -->
      <main class="main-content">
        <h2 id="titulo-main">Selecione uma raça para visualizar</h2>
        
        <!-- Mensagem de estado inicial ou carregamento -->
        <p id="status-imagem">Nenhuma raça selecionada no momento.</p>

        <!-- Elemento de Imagem -->
        <img src="" alt="Imagem do cachorro pesquisado" id="img" style="display: none;" />
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>

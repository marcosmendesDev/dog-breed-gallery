<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeria de Raças de Cães</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header class="app-header">
      <h1>Galeria de Raças de Cães</h1>
    </header>

    <div class="app-container">
      <!-- PAINEL LATERAL (SIDEBAR) -->
      <aside class="sidebar">
        <h2>Raças Disponíveis</h2>

        <!-- Formulário de Busca/Filtro -->
        <form id="search-form">
          <input
            type="text"
            id="search-input"
            placeholder="Buscar raça ou sub-raça..."
          />
          <button type="submit" id="search-button">Buscar</button>
          <button type="button" id="clear-button">Limpar</button>
        </form>

        <!-- Contador de Raças -->
        <p id="total-breeds" class="counter-text"></p>

        <!-- Mensagens de Feedback/Erro da Busca -->
        <p id="message"></p>

        <!-- Container onde o JavaScript vai injetar a lista de Raças -->
        <div id="list-breeds"></div>
      </aside>

      <!-- ÁREA PRINCIPAL (VISUALIZADOR) -->
      <main class="main-content">
        <!-- Cabeçalho com o texto fixo + nome da raça selecionada -->
        <div class="main-header">
          <div>
            <h2>Selecione uma raça para visualizar</h2>
            <p
              id="selected-breed"
              style="
                font-weight: bold;
                font-size: 1.1rem;
                color: #0f172a;
                margin-top: 4px;
              "
            ></p>
          </div>
          <button class="reload">Recarregar</button>
        </div>

        <p id="status-message"></p>

        <!-- Container onde as fotos ficam lado a lado -->
        <div id="image-gallery"></div>
      </main>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
